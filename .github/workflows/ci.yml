name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_USER: huihua
  DB_PASSWORD: hfpwd
  DB_NAME: huihua_finance
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

jobs:
  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: huihua
          POSTGRES_PASSWORD: hfpwd
          POSTGRES_DB: huihua_finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run DB migrations
        run: |
          for f in migrations/*.sql; do
            PGPASSWORD=${{ env.DB_PASSWORD }} psql -h ${{ env.DB_HOST }} -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -f "$f"
          done

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Run Go tests
        run: go test ./... -v -count=1 -timeout 120s

  python-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: huihua
          POSTGRES_PASSWORD: hfpwd
          POSTGRES_DB: huihua_finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests
          go build -o /tmp/huihua-api ./cmd/api

      - name: Run DB migrations
        run: |
          for f in migrations/*.sql; do
            PGPASSWORD=${{ env.DB_PASSWORD }} psql -h ${{ env.DB_HOST }} -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -f "$f"
          done

      - name: Start API server
        run: |
          /tmp/huihua-api &
          sleep 3
          curl -f http://localhost:8080/health || exit 1

      - name: Run Python integration tests
        run: cd tests && python3 test_api.py

  e2e-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: huihua
          POSTGRES_PASSWORD: hfpwd
          POSTGRES_DB: huihua_finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python deps
        run: pip install requests

      - name: Build backend
        run: go build -o /tmp/huihua-api ./cmd/api

      - name: Run DB migrations
        run: |
          for f in migrations/*.sql; do
            PGPASSWORD=${{ env.DB_PASSWORD }} psql -h ${{ env.DB_HOST }} -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -f "$f"
          done

      - name: Start API server
        run: |
          /tmp/huihua-api &
          sleep 3
          curl -f http://localhost:8080/health || exit 1

      - name: Setup frontend
        working-directory: frontend
        run: |
          pnpm install
          npx playwright install chromium

      - name: Run E2E tests
        working-directory: frontend
        run: pnpm test:e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: go vet
        run: go vet ./...

      - name: Frontend build
        working-directory: frontend
        run: |
          pnpm install
          pnpm build
