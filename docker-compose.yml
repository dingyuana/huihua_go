version: '3.8'

# 仅运行基础设施服务（PostgreSQL + Redis）
# Go 后端和前端在宿主机直接运行（开发模式）

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: huihua_finance
      POSTGRES_USER: huihua
      POSTGRES_PASSWORD: hfpwd
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huihua"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: