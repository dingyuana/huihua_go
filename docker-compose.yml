version: '3.8'

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - HF_DATABASE_HOST=postgres
      - HF_DATABASE_PORT=5432
      - HF_DATABASE_USER=huihua
      - HF_DATABASE_PASSWORD=hfpwd
      - HF_DATABASE_DBNAME=huihua_finance
      - HF_DATABASE_SSLMODE=disable
      - HF_REDIS_HOST=redis
      - HF_REDIS_PORT=6379
      - HF_JWT_SECRET=dev-secret-change-in-prod
      - HF_JWT_EXPIRY=30m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ./api

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: huihua_finance
      POSTGRES_USER: huihua
      POSTGRES_PASSWORD: hfpwd
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huihua"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: